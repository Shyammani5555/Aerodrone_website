<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERODRONE CLUB</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #001233; /* dark navy */
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 50px;
    }

    /* 3D glowing heading */
    h1 {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #00b4ff;
      text-shadow:
        2px 2px 0 #0093e9,
        4px 4px 0 #0077b6,
        6px 6px 0 #023e8a,
        8px 8px 20px rgba(0, 255, 255, 0.5);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* social section */
    .socials {
      display: flex;
      gap: 50px;
      justify-content: center;
      align-items: center;
    }

    /* each social button */
    .socials a {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .socials a:hover {
      transform: scale(1.15);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    /* WhatsApp button */
    .whatsapp {
      background-color: #25D366;
    }

    /* Instagram button with gradient */
    .instagram {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    /* white logos */
    .socials img {
      width: 50px;
      height: 50px;
      filter: brightness(0) invert(1); /* makes logo white */
    }
  </style>
</head>
<body>

  <h1>AERODRONE CLUB</h1>

  <div class="socials">
    <a href="https://chat.whatsapp.com/IujeDf0pxqIFJLVpCA7Gdj" target="_blank" class="whatsapp">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="WhatsApp">
    </a>

    <a href="https://www.instagram.com/aerodrone_presidency/" target="_blank" class="instagram">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram">
    </a>
  </div>

</body>
</html>
