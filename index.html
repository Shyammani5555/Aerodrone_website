<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERODRONE CLUB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    /* Background video */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.3);
    }

    /* Main heading animation */
    h1 {
      font-size: 80px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #ffffff;
      text-transform: uppercase;
      display: flex;
      gap: 8px;
      text-shadow:
        2px 2px 0 #999,
        4px 4px 0 #666,
        6px 6px 0 #333,
        8px 8px 20px rgba(255, 255, 255, 0.5);
    }

    h1 span {
      opacity: 0;
      transform: translate(var(--x), var(--y)) scale(0.2) rotate(var(--r));
      animation: flyin 1.5s ease-out forwards;
    }

    @keyframes flyin {
      to {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0);
      }
    }

    /* Social icons */
    .socials {
      display: flex;
      gap: 50px;
      margin-top: 40px;
      justify-content: center;
      align-items: center;
    }

    .socials a {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .socials a:hover {
      transform: scale(1.15);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    .whatsapp {
      background-color: #25D366;
    }

    .instagram {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .socials img {
      width: 50px;
      height: 50px;
      filter: brightness(0) invert(1);
    }
  </style>
</head>
<body>

  <!-- 🔥 Background Video -->
  <video autoplay loop muted playsinline>
    <source src="background.mp4" type="video/mp4" />
  </video>

  <!-- 🌀 Animated Heading -->
  <h1 id="title">
    <span style="--x: -300px; --y: -200px; --r: -90deg;">A</span>
    <span style="--x: 200px; --y: -250px; --r: 120deg;">E</span>
    <span style="--x: -400px; --y: 200px; --r: 180deg;">R</span>
    <span style="--x: 300px; --y: 300px; --r: -120deg;">O</span>
    <span style="--x: -250px; --y: -200px; --r: 90deg;">D</span>
    <span style="--x: 400px; --y: 150px; --r: -150deg;">R</span>
    <span style="--x: -200px; --y: 250px; --r: 180deg;">O</span>
    <span style="--x: 250px; --y: -300px; --r: 80deg;">N</span>
    <span style="--x: -150px; --y: 200px; --r: -100deg;">E</span>
    <span style="--x: 0px; --y: 300px; --r: 180deg;">&nbsp;</span>
    <span style="--x: -200px; --y: -300px; --r: 120deg;">C</span>
    <span style="--x: 300px; --y: 250px; --r: -130deg;">L</span>
    <span style="--x: -250px; --y: -200px; --r: 160deg;">U</span>
    <span style="--x: 200px; --y: -250px; --r: -180deg;">B</span>
  </h1>

  <!-- 📱 Social Buttons -->
  <div class="socials">
    <a href="https://chat.whatsapp.com/IujeDf0pxqIFJLVpCA7Gdj" target="_blank" class="whatsapp">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="WhatsApp">
    </a>

    <a href="https://www.instagram.com/aerodrone_presidency/" target="_blank" class="instagram">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram">
    </a>
  </div>

  <script>
    // Slight delay between each letter flying in
    const spans = document.querySelectorAll("h1 span");
    spans.forEach((span, i) => {
      span.style.animationDelay = `${i * 0.15}s`;
    });
  </script>
</body>
</html>
